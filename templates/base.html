<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --verde:        #5a8a3c;
      --verde-oscuro: #3a6b1f;
      --verde-claro:  #eef5e6;
      --amarillo:     #d4a017;
      --amarillo-claro: #fdf6e3;
      --fondo:        #f0f4e8;
      --borde:        #c8d8a8;
      --texto:        #333;
      --muted:        #777;
      --rojo:         #c0392b;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .navbar {
      background-color: var(--verde-oscuro);
      padding: 10px 20px;
    }

    .navbar-marca {
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .info-usuario {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-rol {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-lider  { background: var(--amarillo-claro); color: #7a5800; border: 1px solid var(--amarillo); }
    .badge-miembro { background: var(--verde-claro); color: var(--verde-oscuro); border: 1px solid var(--borde); }

    .nombre-usuario {
      color: white;
      font-size: 0.9rem;
    }

    .btn-salir {
      padding: 4px 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 4px;
      color: white;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .btn-salir:hover {
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .tarjeta {
      background: white;
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .titulo-seccion {
      font-size: 1rem;
      font-weight: bold;
      color: var(--verde-oscuro);
      margin-bottom: 12px;
      border-bottom: 2px solid var(--borde);
      padding-bottom: 6px;
    }

    .btn-verde {
      background-color: var(--verde);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 6px 14px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-verde:hover { background-color: var(--verde-oscuro); color: white; }

    .btn-completar {
      background-color: var(--amarillo);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-completar:hover { background-color: #b8880f; }

    .badge-estado {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .estado-pendiente  { background: #f0e8c8; color: #7a5800; }
    .estado-en_progreso { background: #d8eaf8; color: #1a4d7a; }
    .estado-completada  { background: var(--verde-claro); color: var(--verde-oscuro); }

    .badge-prioridad {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }
    .prioridad-ALTA  { background: #fde8e8; color: var(--rojo); }
    .prioridad-MEDIA { background: #fdf6e3; color: #7a5800; }
    .prioridad-BAJA  { background: var(--verde-claro); color: var(--verde-oscuro); }

    .campo { margin-bottom: 10px; }
    .campo label { font-size: 0.82rem; color: var(--muted); display: block; margin-bottom: 3px; }

    .input-tf {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.88rem;
      box-sizing: border-box;
    }
    .input-tf:focus { outline: none; border-color: var(--verde); }

    .select-tf {
      padding: 5px 7px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.83rem;
      background: white;
    }
    .select-tf:focus { outline: none; border-color: var(--verde); }

    .mensaje-error { color: var(--rojo); font-size: 0.82rem; margin-top: 5px; }

    .panel-bloqueado {
      text-align: center;
      padding: 20px;
      border: 1px dashed var(--borde);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .htmx-indicator { display: none; font-size: 0.8rem; color: var(--muted); }
    .htmx-request .htmx-indicator { display: inline; }

    .tarea-completada .titulo-tarea {
      text-decoration: line-through;
      color: var(--muted);
    }
  </style>
</head>
<body>

<nav class="navbar d-flex justify-content-between align-items-center mb-4">
  <span class="navbar-marca"> TaskFlow</span>
  {% if current_user %}
  <div class="info-usuario">
    <span class="badge-rol {% if current_user.rol.value == 'lider' %}badge-lider{% else %}badge-miembro{% endif %}">
      {% if current_user.rol.value == 'lider' %}⭐ Líder{% else %}👤 Miembro{% endif %}
    </span>
    <span class="nombre-usuario">@{{ current_user.username }}</span>
    <a href="/logout" class="btn-salir">Cerrar sesión</a>
  </div>
  {% endif %}
</nav>

<div class="container-xl px-4">
  {% block content %}{% endblock %}
</div>

</body>
</html>
