{% extends "base.html" %}

{% block content %}
<div class="row g-4">

  <div class="col-12 col-lg-4">
    {% if es_lider %}
    <div class="tarjeta">
      <div class="titulo-seccion">Nuevo proyecto</div>
      <form hx-post="/htmx/proyectos"
            hx-target="#lista-proyectos"
            hx-swap="innerHTML"
            hx-indicator="#ind-crear">
        <div class="campo">
          <label>Nombre *</label>
          <input type="text" name="nombre" required class="input-tf" placeholder="Nombre del proyecto"/>
        </div>
        <div class="campo">
          <label>Descripción</label>
          <textarea name="descripcion" rows="2" class="input-tf" placeholder="Opcional"></textarea>
        </div>
        <button type="submit" class="btn-verde">Crear proyecto</button>
        <span class="htmx-indicator" id="ind-crear"> Creando...</span>
      </form>
    </div>
    {% else %}
    <div class="tarjeta">
      <div class="titulo-seccion">Tu rol</div>
      <div class="panel-bloqueado">
        <p>Eres miembro del sistema.</p>
        <p>Puedes ver proyectos, agregar tareas y completarlas.<br>
        Solo los líderes pueden crear proyectos.</p>
      </div>
    </div>
    {% endif %}
  </div>

  <div class="col-12 col-lg-8">
    <div class="d-flex align-items-center mb-3">
      <div class="titulo-seccion mb-0" style="border:none; padding:0;">Proyectos</div>
      <button class="btn-verde ms-auto"
              hx-get="/htmx/proyectos"
              hx-target="#lista-proyectos"
              hx-swap="innerHTML">
        Actualizar
      </button>
    </div>

    <div id="lista-proyectos"
         hx-get="/htmx/proyectos"
         hx-trigger="load"
         hx-swap="innerHTML">
      <p style="color: #888;">Cargando...</p>
    </div>
  </div>

</div>
{% endblock %}
