{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card-tf">
      <div class="section-title"><i class="bi bi-folder-plus"></i> Crear proyecto</div>
      <form hx-post="/htmx/proyectos"
            hx-target="#resultado"
            hx-swap="innerHTML">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" name="nombre" class="form-control form-control-tf" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea name="descripcion" class="form-control form-control-tf" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-accent">Crear</button>
      </form>
      <div id="resultado" class="mt-3"></div>
    </div>
  </div>
</div>
{% endblock %}
