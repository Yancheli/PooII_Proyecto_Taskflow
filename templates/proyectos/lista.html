{% if proyectos %}
  {% for proyecto in proyectos %}
  <div class="card-tf">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <div>
        <div style="font-weight: 700; font-size: 1rem;">{{ proyecto.nombre }}</div>
        {% if proyecto.descripcion %}
          <div style="color: var(--tf-muted); font-size: 0.83rem; margin-top: 2px;">{{ proyecto.descripcion }}</div>
        {% endif %}
      </div>
      <span class="badge-tf badge-estado-pendiente">
        <i class="bi bi-list-task me-1"></i>{{ proyecto.tareas | length }} tareas
      </span>
    </div>

    <!-- Botón para ver tareas -->
    <button class="btn btn-accent"
            style="font-size:0.8rem; padding: 0.3rem 0.9rem; margin-top: 0.5rem;"
            hx-get="/htmx/proyectos/{{ proyecto.id }}/tareas"
            hx-target="#tareas-{{ proyecto.id }}"
            hx-swap="innerHTML"
            hx-trigger="click">
      <i class="bi bi-eye me-1"></i>Ver tareas
    </button>

    <!-- Formulario nueva tarea -->
    <details class="mt-3">
      <summary style="cursor:pointer; color: var(--tf-accent); font-size: 0.85rem; font-weight:600;">
        <i class="bi bi-plus me-1"></i>Agregar tarea
      </summary>
      <form hx-post="/htmx/proyectos/{{ proyecto.id }}/tareas"
            hx-target="#tareas-{{ proyecto.id }}"
            hx-swap="innerHTML"
            class="mt-2">
        <div class="row g-2">
          <div class="col-12 col-sm-5">
            <input type="text" name="titulo" required
                   class="form-control form-control-tf form-control-sm"
                   placeholder="Título de la tarea"/>
          </div>
          <div class="col-12 col-sm-4">
            <input type="text" name="descripcion"
                   class="form-control form-control-tf form-control-sm"
                   placeholder="Descripción (opcional)"/>
          </div>
          <div class="col-6 col-sm-2">
            <select name="prioridad" class="form-select form-select-tf form-select-sm">
              <option value="ALTA">Alta</option>
              <option value="MEDIA" selected>Media</option>
              <option value="BAJA">Baja</option>
            </select>
          </div>
          <div class="col-6 col-sm-1">
            <button type="submit" class="btn btn-accent btn-sm w-100">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
        </div>
      </form>
    </details>

    <!-- Contenedor de tareas -->
    <div id="tareas-{{ proyecto.id }}" class="mt-3"></div>
  </div>
  {% endfor %}
{% else %}
  <div class="card-tf text-center py-4" style="color: var(--tf-muted);">
    <i class="bi bi-inbox" style="font-size: 2rem;"></i>
    <p class="mt-2 mb-0">No hay proyectos todavía. ¡Crea el primero!</p>
  </div>
{% endif %}
