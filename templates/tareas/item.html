<div id="tarea-{{ tarea.id }}"
     class="d-flex align-items-center gap-2 py-2 {% if tarea.estado == 'completada' %}tarea-completada{% endif %}"
     style="border-bottom: 1px solid #e0ead0;">

     <!-- Titulo de tarea -->
  <div class="flex-grow-1">
    <span class="titulo-tarea" style="font-size: 0.88rem;">{{ tarea.titulo }}</span>
    {% if tarea.descripcion %}
      <span style="color: #888; font-size: 0.78rem;"> — {{ tarea.descripcion }}</span>
    {% endif %}
  </div>

  <!-- estado -->
  <span class="badge-estado estado-{{ tarea.estado }}">
    {{ tarea.estado | replace("_", " ") }}
  </span>

  <!-- prioridad -->
  <form hx-patch="/htmx/tareas/{{ tarea.id }}/prioridad"
        hx-target="#tarea-{{ tarea.id }}"
        hx-swap="outerHTML"
        hx-trigger="change">
    <select name="prioridad" class="select-tf" style="font-size: 0.78rem;">
      <option value="ALTA"  {% if tarea.prioridad == 'ALTA'  %}selected{% endif %}>Alta</option>
      <option value="MEDIA" {% if tarea.prioridad == 'MEDIA' %}selected{% endif %}>Media</option>
      <option value="BAJA"  {% if tarea.prioridad == 'BAJA'  %}selected{% endif %}>Baja</option>
    </select>
  </form>

  <!-- Botón completar -->
  {% if tarea.estado != 'completada' %}
  <button class="btn-completar"
          hx-patch="/htmx/tareas/{{ tarea.id }}/completar"
          hx-target="#tarea-{{ tarea.id }}"
          hx-swap="outerHTML">
    ✓
  </button>
  {% else %}
<span style="color: #5a8a3c; font-size: 0.85rem;">✓ listo</span>
  {% endif %}

</div>
